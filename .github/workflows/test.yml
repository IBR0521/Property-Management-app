# Runs the suite on every push and pull request.
#
# A Postgres service container rather than a hosted database: the suite drops
# and rebuilds the public schema on whatever it is given, so pointing CI at
# anything shared would eventually be pointed at the wrong thing. A container
# is thrown away with the job.
#
# Two Node versions because package.json says >=20 and the app runs on 22
# locally. A claim of 20 support that nothing exercises is not a claim.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match the major version Supabase runs, so a version-specific SQL
        # behaviour fails here rather than in production.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: propops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run the suite
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/propops_test
          # Present so the encryption paths are exercised rather than skipped.
          # A fixed value is correct here: it protects nothing real.
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: npm test
